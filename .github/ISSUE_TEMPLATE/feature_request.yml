name: Feature request
description: A change to what the plugin does.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where the plugin falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What the plugin should do instead.
    validations:
      required: true
  - type: textarea
    id: harm-prevented
    attributes:
      label: The harm it prevents
      description: What goes wrong without it, and how often.
    validations:
      required: true
